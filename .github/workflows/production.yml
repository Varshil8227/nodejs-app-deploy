name: Eventora CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag like v1.0.0'
        required: true
        default: 'v1.0.0'

jobs:
  test-client:
    name: "CI — Frontend Built Verification"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: client

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Configure Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: "Install Dependencies"
        run: npm ci

      - name: "Compile Application Assets"
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_VITE_API_URL }}

      - name: "Validate Distribution Artifacts"
        run: |
          [ -d "dist" ] && echo "✅ Artifact distribution directory verified." || { echo "❌ Critical Error: 'dist' build directory missing."; exit 1; }
          [ -f "dist/index.html" ] && echo "✅ Entrypoint index.html verified." || { echo "❌ Critical Error: 'dist/index.html' entrypoint missing."; exit 1; }
  test-server:
    name: "CI — Backend Server Verification"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Configure Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: "Install Production Dependencies"
        run: npm ci --legacy-peer-deps

      - name: "Execute Server Test Suite"
        run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          PORT: 5000
          VITE_API_URL: "http://localhost:5000"

      - name: "Validate Application Architecture"
        run: |
          [ -f "package.json" ] && echo "✅ Manifest package.json verified." || { echo "❌ Critical Error: 'package.json' missing."; exit 1; }
          { [ -f "index.js" ] || [ -f "app.js" ] || [ -f "server.js" ]; } && echo "✅ Application entrypoint verified." || { echo "❌ Critical Error: Node.js entrypoint file missing."; exit 1; }