name: Eventora CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v1.*' # જ્યારે પણ v1.0.0, v1.1.0 જેવા ટેગ પુશ થાય ત્યારે આ ટ્રિગર થશે
  pull_request:
    types: [closed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================
  # CI STAGE: કોડ પુશ કે ટેગ પુશ બંને વખતે ટેસ્ટ રન થશે
  # ==========================================
  test-client:
    name: "CI — Frontend Built Verification"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4
      - name: "Configure Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: "Install Dependencies"
        run: npm ci
      - name: "Compile Application Assets"
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_VITE_API_URL }}
      - name: "Validate Distribution Artifacts"
        run: |
          [ -d "dist" ] && echo "✅ Artifact distribution directory verified." || { echo "❌ Critical Error: 'dist' build directory missing."; exit 1; }
          [ -f "dist/index.html" ] && echo "✅ Entrypoint index.html verified." || { echo "❌ Critical Error: 'dist/index.html' entrypoint missing."; exit 1; }

  test-server:
    name: "CI — Backend Server Verification"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4
      - name: "Configure Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: "Install Production Dependencies"
        run: npm ci --legacy-peer-deps
      - name: "Validate Node.js Code Syntax"
        run: |
          if [ -f "index.js" ]; then node --check index.js; fi
          if [ -f "app.js" ]; then node --check app.js; fi
          if [ -f "server.js" ]; then node --check server.js; fi
          echo "✅ Backend syntax verification completed successfully."
      - name: "Validate Application Architecture"
        run: |
          [ -f "package.json" ] && echo "✅ Manifest package.json verified." || { echo "❌ Critical Error: 'package.json' missing."; exit 1; }
          { [ -f "index.js" ] || [ -f "app.js" ] || [ -f "server.js" ]; } && echo "✅ Application entrypoint verified." || { echo "❌ Critical Error: Node.js entrypoint file missing."; exit 1; }

  # ==========================================
  # CD STAGE: આ જોબ ફક્ત ત્યારે જ ચાલશે જ્યારે ગિટ ટેગ પુશ થયો હોય
  # ==========================================
  build-and-push:
    name: "CD — Build & Push Docker Images"
    needs: [test-client, test-server]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v1.')
    environment: production
    
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Extract Version from Git Tag"
        id: get_version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: "Build and Push Client Image"
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventora-client:${{ steps.get_version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/eventora-client:latest
          build-args: |
            VITE_API_URL=${{ secrets.PRODUCTION_VITE_API_URL }}

      - name: "Build and Push Server Image"
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventora-server:${{ steps.get_version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/eventora-server:latest

      # =============================================================
      # 🔥 NEW GITOPS AUTOMATION STEP: ઓટોમેટિકલી હેલ્મ વેલ્યુસ અપડેટ કરવી
      # =============================================================
      - name: "Update GitOps Manifest Repo (values.yaml)"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ૧. ગિટઓપ્સ રેપો કલોન કરો
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/${{ github.repository_owner }}/eventora-gitops-manifests.git gitops-repo
          cd gitops-repo
          
          # ૨. values.yaml ની અંદર ફ્રન્ટએન્ડ અને બેકએન્ડ બંનેના ટેગ્સ નવા વર્ઝનથી અપડેટ કરો
          # આ સેડ કમાન્ડ ફાઇલની અંદર સ્પેસિફિક ટેગ શોધીને તેને સબસ્ટિટ્યુટ કરી દેશે
          sed -i "s/tag: \".*\"/tag: \"${{ steps.get_version.outputs.tag }}\"/g" values.yaml
          
          # ૩. ચેન્જીસ ગિટઓપ્સ રેપોમાં કમિટ કરી પુશ કરો
          git add values.yaml
          git commit -m "chore: automated deployment update to ${{ steps.get_version.outputs.tag }} [skip ci]"
          git push origin main




        
