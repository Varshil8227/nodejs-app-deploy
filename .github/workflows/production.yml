name: Eventora CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag like v1.0.0'
        required: true
        default: 'v1.0.0'

jobs:
    test-client:
    name: "CI — Frontend Build Verification"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: client

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Configure Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: "Install Dependencies"
        run: npm ci

      - name: "Compile Application Assets"
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_VITE_API_URL }}

      - name: "Validate Distribution Artifacts"
        run: |
          [ -d "dist" ] && echo "✅ Artifact distribution directory verified." || { echo "❌ Critical Error: 'dist' build directory missing."; exit 1; }
          [ -f "dist/index.html" ] && echo "✅ Entrypoint index.html verified." || { echo "❌ Critical Error: 'dist/index.html' entrypoint missing."; exit 1; }
