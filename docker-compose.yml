services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: eventora-server:${IMAGE_TAG:-latest}
    container_name: eventora-server
    restart: unless-stopped
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    image: eventora-client:${IMAGE_TAG:-latest}
    container_name: eventora-client
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - server